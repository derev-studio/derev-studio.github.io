<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18263b"><title>Территория тепла — пингвины</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 20%,#694d68,#18263b 65%);color:#fff4df;font:17px system-ui,sans-serif;text-align:center}main{max-width:820px;margin:auto;padding:22px 14px 30px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,54px);margin:8px 0}p{line-height:1.5;margin:10px auto;max-width:580px}#stage{height:min(55vh,490px);min-height:300px;position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(#45496d,#b88a8c 65%,#dddde9);border:1px solid #ffffff30;touch-action:pan-y}canvas{display:block;width:100%;height:100%;touch-action:none}#fallback{position:absolute;inset:0;display:grid;place-content:center;font-size:90px;pointer-events:none}#fallback small{font-size:15px;color:#fff}#msg{min-height:60px;display:grid;place-content:center;font-size:21px;font-family:Georgia,serif}button{border:1px solid #ffffff40;background:#fff0db;color:#392b36;font:600 16px system-ui;border-radius:100px;padding:12px 18px;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #f7b664}button.secondary{background:#ffffff12;color:#fff}#hint{font-size:13px;opacity:.8}footer{font-size:12px;opacity:.6;margin-top:18px}#glow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px #ffcf8050;opacity:0;transition:opacity 1s}#stage.warm #glow{opacity:1}
</style></head><body><main><h1>Территория тепла</h1><p>Приходи к нам, к пингвинам. Мы умеем согревать друг друга даже в самые лютые морозы.</p><div id="stage" aria-label="Интерактивная трёхмерная модель пингвинов"><div id="fallback">🐧<small>Здесь тебе всегда рады.</small></div><div id="glow"></div></div><div id="hint">Проведи пальцем или мышкой, чтобы повернуть пингвинов.</div><div id="msg" aria-live="polite">Можно просто немного побыть с нами.</div><div><button id="hug">Обнять 🐧</button><button id="pet" class="secondary">Погладить</button><button id="tea" class="secondary">Чашечку чая ☕</button><button id="music" class="secondary" aria-pressed="false">Музыка ♫</button></div><footer>Маленькая сказка о тепле. Без регистрации и сбора данных на странице.</footer></main>
<script>
let action='idle',until=0;const msg=document.getElementById('msg'),stage=document.getElementById('stage');function act(a,s){action=a;until=performance.now()+6500;msg.textContent=s;stage.classList.add('warm');clearTimeout(window.warmTimer);window.warmTimer=setTimeout(()=>stage.classList.remove('warm'),6500)}
document.getElementById('hug').onclick=()=>act('hug','Подвинься поближе. Согреемся вместе.');
document.getElementById('pet').onclick=()=>act('pet','Как приятно! Спасибо за твоё тепло.');
document.getElementById('tea').onclick=()=>act('tea','Вот тебе горячий чай. Не спеши, отдохни.');
let audio,timer,playing=false;const mb=document.getElementById('music');function notes(){if(!playing)return;const f=[261.63,329.63,392,440,392,329.63,293.66,349.23];f.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.7;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.12);g.gain.exponentialRampToValueAtTime(.001,t+1.15);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+1.2)})}mb.onclick=async()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();playing=!playing;if(playing){await audio.resume();notes();timer=setInterval(notes,6200)}else{clearInterval(timer);await audio.suspend()}mb.textContent=playing?'Выключить музыку':'Музыка ♫';mb.setAttribute('aria-pressed',String(playing))}catch(e){msg.textContent='Музыка недоступна в этом браузере.'}};
</script><script type="module">
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x8d829e);scene.fog=new T.FogExp2(0xb7a7bf,.038);const camera=new T.PerspectiveCamera(38,1,.1,100);camera.position.set(0,2.65,8.7);camera.lookAt(0,1.38,0);
const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;stage.prepend(renderer.domElement);document.getElementById('fallback').style.display='none';const fit=()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()};new ResizeObserver(fit).observe(stage);fit();
scene.add(new T.HemisphereLight(0xfff1de,0x697baf,2.2));const sun=new T.DirectionalLight(0xffc082,3.3);sun.position.set(-4,6,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const rim=new T.DirectionalLight(0xffbb7e,2);rim.position.set(3,4,-4);scene.add(rim);
const mat=(c,r=.85)=>new T.MeshStandardMaterial({color:c,roughness:r});const dark=mat(0x202b35),white=mat(0xfff4d9),gold=mat(0xffb533),orange=mat(0xe68b35),black=mat(0x090e15,.24),gray=mat(0x9ca2ac),snow=mat(0xf0eafa),cupMat=mat(0xffe9ce,.3);
const sphere=new T.SphereGeometry(1,36,28);function ell(parent,m,x,y,z,a,b,c){let o=new T.Mesh(sphere,m);o.position.set(x,y,z);o.scale.set(a,b,c);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=new T.Mesh(new T.PlaneGeometry(100,100),snow);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<13;i++){const m=new T.Mesh(new T.ConeGeometry(2.2+Math.sin(i*9)*.7,4+Math.cos(i*7)*2,5),mat(0xb8b8d3));m.position.set((i-6)*2.5,1.3,-9-Math.sin(i*4)*2);scene.add(m)}
const world=new T.Group();scene.add(world);function penguin(x,z,s,chick=false){const g=new T.Group();world.add(g);g.position.set(x,0,z);g.scale.setScalar(s);let body=ell(g,chick?gray:dark,0,1.0,0,.68,.99,.52);ell(g,chick?white:white,0,.98,.26,.53,.85,.34);let head=new T.Group();head.position.set(0,1.91,.04);g.add(head);ell(head,chick?gray:dark,0,0,0,.48,.48,.43);if(chick){ell(head,white,-.15,-.04,.32,.23,.31,.17);ell(head,white,.15,-.04,.32,.23,.31,.17)}else{ell(head,gold,-.37,-.13,.04,.095,.24,.25);ell(head,gold,.37,-.13,.04,.095,.24,.25);ell(g,gold,0,1.56,.37,.27,.19,.13)}
let eyes=[ell(head,black,-.19,.05,.36,.06,.075,.055),ell(head,black,.19,.05,.36,.06,.075,.055)];for(let i of [-1,1]){ell(head,white,i*.19-.018,.077,.402,.018,.018,.012);ell(g,chick?gray:dark,i*.24,.105,.22,.25,.12,.35)}
const beak=new T.Mesh(new T.ConeGeometry(chick?.12:.15,chick?.24:.48,32),chick?black:orange);beak.rotation.x=Math.PI/2;beak.position.set(0,-.12,.50);head.add(beak);
const wings=[];for(let i of [-1,1]){let w=new T.Group();w.position.set(i*.57,1.40,0);g.add(w);let e=ell(w,chick?gray:dark,i*.07,-.37,.015,.16,.58,.22);e.rotation.z=i*.12;w.rotation.z=i*.22;wings.push(w)}return {g,head,eyes,wings}}
const hero=penguin(0,.2,1.13);const left=penguin(-1.46,-.68,.8),right=penguin(1.46,-.68,.8);left.g.rotation.y=.32;right.g.rotation.y=-.32;const chick1=penguin(-.94,1.05,.42,true),chick2=penguin(.95,1.03,.42,true);
const tea=new T.Group();world.add(tea);tea.position.set(1.03,.22,1.5);tea.visible=false;const mug=new T.Mesh(new T.CylinderGeometry(.18,.15,.29,32),cupMat);tea.add(mug);ell(tea,mat(0x754422),0,.145,0,.17,.015,.17);const handle=new T.Mesh(new T.TorusGeometry(.11,.034,10,30),cupMat);handle.position.x=.20;tea.add(handle);
const snowGeo=new T.BufferGeometry(),arr=new Float32Array(240*3);for(let i=0;i<240;i++){arr[i*3]=(Math.random()-.5)*15;arr[i*3+1]=Math.random()*7;arr[i*3+2]=(Math.random()-.5)*10}snowGeo.setAttribute('position',new T.BufferAttribute(arr,3));const flakes=new T.Points(snowGeo,new T.PointsMaterial({color:0xffffff,size:.035,transparent:true,opacity:.75}));scene.add(flakes);
let drag=false,last=0,turn=0,rotation=0;const c=renderer.domElement;c.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){turn+=(e.clientX-last)*.012;last=e.clientX}});c.addEventListener('pointerup',()=>{drag=false});c.addEventListener('pointercancel',()=>{drag=false});const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){requestAnimationFrame(loop);let t=now*.001;if(now>until)action='idle';rotation+=(turn-rotation)*.12;world.rotation.y=rotation;for(const p of [hero,left,right,chick1,chick2]){p.head.rotation.z=reduce?0:Math.sin(t*1.1+p.g.position.x)*.035;let blink=reduce?1:Math.sin(t*1.4+p.g.position.x)> .995?.1:1;p.eyes.forEach(e=>e.scale.y=.075*blink);p.g.position.y=reduce?0:Math.sin(t*1.6+p.g.position.x)*.018}
let spread=action==='hug'?1.06:action==='pet'?.48:.23;hero.wings.forEach((w,i)=>{let sign=i?1:-1;w.rotation.z+=(sign*spread-w.rotation.z)*.08;w.rotation.x+=((action==='hug'?-.36:0)-w.rotation.x)*.08});hero.head.rotation.x+=( (action==='pet'?.23:action==='hug'?.13:0)-hero.head.rotation.x)*.08;tea.visible=action==='tea';if(!reduce){for(let i=0;i<240;i++){arr[i*3+1]-=.012;if(arr[i*3+1]<0)arr[i*3+1]=7}snowGeo.attributes.position.needsUpdate=true}renderer.render(scene,camera)}requestAnimationFrame(loop);
}catch(e){document.getElementById('hint').textContent='3D не загрузилось, но кнопки подарка продолжают работать.';console.warn(e)}
</script></body></html>
