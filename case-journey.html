const data={
ru:{home:'Империя Александра Деревяшкина',genre:'Художественный рассказ',title:'Путешествие футляра',subtitle:'От древнего моря до берегов Кинерета',author:'Александр Деревяшкин',intro:'Обыкновенный чёрный футляр для телефона. Но его история началась задолго до рождения человека — и продолжается сегодня, среди самолётов, кораблей и дорог.',return:'← На главную',note:'История происхождения материалов и этапов производства изложена в художественной форме. Документально подтверждённая часть пути: Ньюарк (11 октября), Буэна-Парк (12–13 октября), перевозчик Gaash Worldwide Ltd. Дата 29 октября 2026 года — прогноз Amazon; остальные географические этапы являются литературной реконструкцией.',chapters:[
['Когда Земля была молода',['Триста миллионов лет назад на Земле не существовало ни Китая, ни Америки, ни Израиля. Древние моря были населены бесчисленными крошечными существами. Они жили, поглощали солнечный свет, умирали и опускались на морское дно.','Слои ила медленно хоронили органические остатки. Шли миллионы лет. Под действием тепла и давления часть этой органики превращалась в вещества, из которых впоследствии образовывались нефть и природный газ. Нефть — наследие главным образом микроскопической древней жизни, а не погибших динозавров.','В глубине Земли ещё не было ни пластмассы, ни телефонов. Но природа уже готовила материал для вещей, которых никто тогда не мог даже вообразить.']],
['Чёрный фонтан',['Прошли геологические эпохи. Человек научился находить нефть глубоко под землёй, бурить скважины, поднимать её на поверхность и перевозить к перерабатывающим заводам.','Представьте чёрный фонтан, вырывающийся в оранжевое небо: когда-то подобные фонтаны сопровождали открытие богатых месторождений. Сегодня добычу обычно тщательно контролируют.','Из углеводородного сырья получают вещества для химической промышленности. Полимерные гранулы станут основой некоторых деталей защитного футляра. Металл для подставки и минеральное сырьё для стекла пройдут свои собственные дороги.']],
['Рождение в Китае',['На фабрике в провинции Гуандун машина нагревает полимерные гранулы. Расплавленный материал под давлением заполняет пресс-форму. Через мгновение рождается чёрная деталь с угловатыми линиями и креплениями.','Рабочие собирают футляр. Один устанавливает складное кольцо-подставку, другой берёт телефон и проверяет, точно ли всё подходит. Телефон поворачивают в руках, проверяют отверстия камеры и кнопки.','Наконец футляр ложится в упаковку. Маленький предмет готовится к огромному путешествию.']],
['По другую сторону океана',['Контейнеры поднимают портовые краны. Огромный корабль отходит от берегов Азии, и впереди простирается Тихий океан. Восходы, шторма и бесконечные водные пространства сменяют друг друга.','В трюме и контейнерах — тысячи незнакомых друг другу вещей. Среди них находится и маленький чёрный футляр, несущий в себе память о древнем море.','Ему предстоит оказаться в Америке, на другом берегу величайшего океана Земли.']],
['Калифорнийские дороги',['11 октября 2026 года, в 15:48, система Amazon отмечает прибытие посылки в Ньюарк, Калифорния. В 22:04 она покидает этот объект.','12 октября, в 11:08, посылка прибывает в Буэна-Парк. 13 октября, в 03:34 утра, следует новая запись: «Посылка покинула объект Amazon».','Так появляются первые настоящие координаты путешествия. А впереди — международная доставка компанией Gaash Worldwide Ltd.']],
['Над морями и странами',['Из Калифорнии дорога ведёт дальше — к Израилю. Международные грузы пересекают материки, аэропорты и моря; меняются самолёты, часовые пояса и языки.','Там, где прежде путешественнику потребовались бы долгие месяцы, современная логистика соединяет страны за дни. Где-то среди тысяч отправлений движется скромная коробочка с футляром.','В электронном заказе горит дата: 29 октября. Это день ожидаемого прибытия, а не завершённое путешествие.']],
['Земля Галилеи',['На севере Израиля лежит Кинерет — Галилейское море. По его берегам две тысячи лет назад ходил Иисус. На этом озере, согласно Евангелию от Луки, во время бури Он спросил учеников: «Где вера ваша?»','С холмами Галилеи связывают Нагорную проповедь — слова о милосердии, прощении и любви. Из Кинерета вытекает Иордан; традиционное место крещения Иисуса находится значительно южнее озера.','На западном берегу Кинерета стоит Тверия. Её история помнит римскую эпоху, смену царств и поколений. Озеро осталось, и солнце по-прежнему встаёт над его водой.','Сюда направляется небольшая посылка, путь которой начался в древнем море задолго до человеческой истории. А затем футляр продолжит свою дорогу к другу, для которого он предназначен. Иногда самая обыкновенная вещь имеет биографию длиннее истории цивилизации.']]
]},
en:{home:'Alexander Derevyashkin’s World',genre:'A literary story',title:'The Journey of a Phone Case',subtitle:'From an ancient sea to the shores of the Kinneret',author:'Alexander Derevyashkin',intro:'An ordinary black phone case. Yet its story began long before humanity and continues today across ships, aircraft and roads.',return:'← Home',note:'The origin of the materials and manufacturing journey are literary reconstruction. Confirmed tracking: Newark on October 11, Buena Park on October 12–13; carrier Gaash Worldwide Ltd. October 29, 2026 is Amazon’s estimated delivery date, not confirmation of arrival.',chapters:[
['When the Earth Was Young',['Three hundred million years ago, there was no China, America or Israel. Ancient seas swarmed with microscopic life. Organisms died and settled on the seafloor, where sediments buried them slowly.','Over millions of years, heat and pressure transformed some buried organic matter into the sources of oil and natural gas. Oil comes mainly from ancient microscopic life, not from dinosaurs.','Nature had begun preparing the raw materials for objects no living being could have imagined.']],
['The Black Fountain',['Many geological ages later, humans drilled down through rock and brought oil to the surface. The early oil industry sometimes saw spectacular gushers reaching into the sky; modern wells are controlled.','Refineries and chemical plants transformed hydrocarbons into ingredients for polymers. Metal parts and protective glass began their own journeys from ores and minerals.','Different ancient materials would eventually meet in a single little phone case.']],
['Born in China',['In a factory in Guangdong, polymer granules melt and are forced into a metal mould. A rigid black piece emerges, marked with angular protective patterns.','Workers assemble the case and its folding ring stand. A technician holds a real phone, checking the camera openings, buttons and fit. The finished case is packed carefully.','Its journey across the world is about to begin.']],
['Across the Pacific',['Port cranes lift containers onto a vast cargo ship. The Pacific opens ahead: storms, sunrises and thousands of kilometres of water.','Packed among countless other goods, the little case travels silently, carrying within it the chemical legacy of ancient oceans.','A new continent waits on the far side.']],
['California Roads',['On October 11, 2026, at 3:48 p.m., Amazon records the package arriving in Newark, California. It leaves at 10:04 p.m.','On October 12 at 11:08 a.m. it reaches Buena Park. On October 13 at 3:34 a.m., the tracking says: “Package left an Amazon facility.”','These are the confirmed stages. Its international carrier is Gaash Worldwide Ltd.']],
['Above Seas and Countries',['The journey now leads towards Israel, across a modern network of airports, cargo facilities and international routes. An ocean crossing that once took months can now be achieved in hours of flight.','A tiny parcel moves through a world of enormous machines. Amazon displays October 29 as its estimated arrival date — the story is not over yet.']],
['The Land of Galilee',['In northern Israel lies the Kinneret, the Sea of Galilee. According to the Gospels, Jesus walked these shores. During a storm on this lake he asked his disciples: “Where is your faith?”','The hills of Galilee are associated with the Sermon on the Mount. The Jordan River flows south from the lake; the traditional site of Jesus’ baptism is much farther downstream.','Tiberias stands on the western shore. Empires have come and gone, yet the sun still rises over the water. Here the parcel is headed, before continuing onward to the friend for whom the case is intended.','Even an ordinary object may have a story longer than human civilisation.']]
]},
he:{home:'עולמו של אלכסנדר דרביאשקין',genre:'סיפור ספרותי',title:'מסעו של כיסוי הטלפון',subtitle:'מן הים הקדום עד חופי הכנרת',author:'אלכסנדר דרביאשקין',intro:'כיסוי שחור ופשוט לטלפון. אבל סיפורו החל זמן רב לפני הופעת האדם ונמשך היום בין אוניות, מטוסים וכבישים.',return:'→ לדף הבית',note:'תיאור היווצרות החומרים ומסלול הייצור הוא שחזור ספרותי. המעקב מאשר את ניוארק ב־11 באוקטובר ואת בואנה פארק ב־12–13 באוקטובר. חברת השילוח: Gaash Worldwide Ltd. ה־29 באוקטובר 2026 הוא תאריך הגעה משוער בלבד.',chapters:[
['כשהארץ הייתה צעירה',['לפני שלוש מאות מיליון שנה לא היו סין, אמריקה או ישראל. הימים הקדומים היו מלאים יצורים זעירים. לאחר מותם שקעו בקרקעית ונקברו מתחת לשכבות משקעים.','במשך מיליוני שנים הפכו חום ולחץ חלק מן החומר האורגני למקורות של נפט וגז. הנפט נוצר בעיקר מחיים מיקרוסקופיים קדומים, ולא מדינוזאורים.','הטבע הכין חומרים לחפצים שאיש עדיין לא היה מסוגל לדמיין.']],
['המזרקה השחורה',['כעבור עידנים למד האדם לקדוח לעומק האדמה ולהפיק נפט. בעבר התפרצו לעיתים מזרקות נפט מרהיבות; כיום הבארות נשלטות ומפוקחות.','בתי זיקוק ומפעלים פטרוכימיים יצרו חומרי גלם לפולימרים. המתכת והזכוכית החלו מסעות נפרדים מתוך עפרות ומינרלים.','חומרים ממקורות שונים עמדו להיפגש בכיסוי קטן אחד.']],
['נולד בסין',['במפעל במחוז גואנגדונג מחממים גרגרי פולימר ומזריקים את החומר לתבנית מתכת. מתוכה יוצא חלק שחור עם קווים זוויתיים.','העובדים מרכיבים טבעת מתקפלת, מחזיקים טלפון בידיים ובודקים את החורים למצלמה, את הכפתורים ואת ההתאמה.','לבסוף הכיסוי נארז ומתחיל במסעו הארוך.']],
['מעבר לאוקיינוס השקט',['מנופי הנמל מעלים מכולות לאוניית משא עצומה. האוקיינוס השקט נפרש לפניה, עם סערות, זריחות ואלפי קילומטרים של מים.','בין אינספור פריטים נמצא כיסוי קטן ושחור, הנושא בתוכו זיכרון כימי של ימים קדומים.']],
['דרכי קליפורניה',['ב־11 באוקטובר 2026, בשעה 15:48, נרשמה הגעת החבילה לניוארק שבקליפורניה. בשעה 22:04 היא יצאה משם.','ב־12 באוקטובר, בשעה 11:08, הגיעה לבואנה פארק. ב־13 באוקטובר, בשעה 03:34, נרשם כי החבילה יצאה ממתקן של אמזון.','אלה תחנות המסע שאושרו במעקב. חברת השילוח הבינלאומי היא Gaash Worldwide Ltd.']],
['מעל ימים וארצות',['הדרך ממשיכה לעבר ישראל ברשת של שדות תעופה ונתיבי שילוח. מסע ימי שבעבר נמשך חודשים יכול כיום להיעשות בשעות של טיסה.','התאריך המופיע באמזון הוא 29 באוקטובר — מועד הגעה משוער, ולא אישור מסירה.']],
['ארץ הגליל',['בצפון ישראל נמצאת הכנרת. לפי ספרי הבשורה, ישוע הלך על חופיה ובזמן סערה שאל את תלמידיו: ״איה אמונתכם?״','הגבעות בגליל קשורות לדרשה על ההר. הירדן יוצא מן הכנרת וזורם דרומה; מקום הטבילה המסורתי של ישוע נמצא הרחק במורד הנהר.','טבריה ניצבת על החוף המערבי של האגם. ממלכות ועמים התחלפו, אך השמש עדיין עולה מעל המים. אל העיר הזאת מתקדמת החבילה, לפני שתמשיך אל החבר שעבורו מיועד הכיסוי.','לפעמים גם לחפץ פשוט יש ביוגרפיה ארוכה מתולדות הציוויליזציה.']]
]},
ar:{home:'عالم ألكسندر ديريفياشكين',genre:'قصة أدبية',title:'رحلة غطاء الهاتف',subtitle:'من البحر القديم إلى ضفاف بحيرة طبريا',author:'ألكسندر ديريفياشكين',intro:'غطاء هاتف أسود بسيط، لكن قصته بدأت قبل ظهور الإنسان بزمن طويل، وما زالت مستمرة اليوم عبر السفن والطائرات والطرق.',return:'→ الصفحة الرئيسية',note:'أصل المواد ومراحل التصنيع موصوفة بأسلوب أدبي. المحطات المؤكدة بحسب التتبع: نيوارك في 11 أكتوبر وبوينا بارك في 12 و13 أكتوبر. شركة الشحن Gaash Worldwide Ltd. يوم 29 أكتوبر 2026 هو الموعد المتوقع للوصول وليس تأكيداً للتسليم.',chapters:[
['حين كانت الأرض فتية',['قبل ثلاثمئة مليون سنة لم تكن الصين أو أمريكا أو إسرائيل موجودة. امتلأت البحار القديمة بكائنات مجهرية عاشت وماتت واستقرت بقاياها في القاع تحت طبقات الرواسب.','وبمرور ملايين السنين غيّرت الحرارة والضغط بعض هذه المواد العضوية لتصبح مصدراً للنفط والغاز الطبيعي. فالنفط نشأ أساساً من حياة مجهرية قديمة، لا من الديناصورات.','كانت الطبيعة تهيئ مواد لأشياء لم يتخيلها أحد بعد.']],
['النافورة السوداء',['بعد عصور جيولوجية طويلة تعلم الإنسان الحفر في الصخور واستخراج النفط. وقد اندفعت من بعض الآبار القديمة نوافير نفط مذهلة، بينما تخضع الآبار الحديثة للتحكم.','حوّلت المصافي والمصانع الكيميائية المواد الهيدروكربونية إلى مكونات لصناعة البوليمرات. أما المعادن والزجاج فلها رحلات أخرى تبدأ من الخامات والمعادن الطبيعية.']],
['الميلاد في الصين',['في مصنع بمقاطعة غوانغدونغ تُسخَّن حبيبات البوليمر وتُحقن في قالب معدني. تخرج قطعة سوداء بنقوش هندسية واقية.','يركب العمال الغطاء وحلقته القابلة للطي. يمسك أحدهم الهاتف ويتحقق من فتحات الكاميرا والأزرار ومدى ملاءمة الغطاء.','ثم يوضع الغطاء في علبته استعداداً لرحلته الطويلة.']],
['عبر المحيط الهادئ',['ترفع رافعات الميناء الحاويات إلى سفينة شحن ضخمة. يمتد المحيط الهادئ أمامها، بأمواجه وعواصفه وشروق شمسه ومسافاته الهائلة.','وبين آلاف الأشياء يسافر غطاء أسود صغير، يحمل في مادته أثراً من البحار القديمة.']],
['طرقات كاليفورنيا',['في 11 أكتوبر 2026، الساعة 15:48، سجلت أمازون وصول الطرد إلى نيوارك في كاليفورنيا. وغادر الموقع الساعة 22:04.','وفي 12 أكتوبر الساعة 11:08 وصل إلى بوينا بارك. وفي 13 أكتوبر الساعة 03:34 ظهرت رسالة: «غادر الطرد منشأة تابعة لأمازون».','هذه محطات أكدتها بيانات التتبع. وتتولى Gaash Worldwide Ltd الشحن الدولي.']],
['فوق البحار والبلدان',['تستمر الرحلة نحو إسرائيل عبر شبكة المطارات ومراكز الشحن العالمية. وما كان يستغرق شهوراً في الماضي يمكن أن يتم اليوم خلال ساعات من الطيران.','يظهر على طلب أمازون تاريخ 29 أكتوبر بوصفه الموعد المتوقع للوصول. الرحلة لم تنته بعد.']],
['أرض الجليل',['في شمال إسرائيل تقع بحيرة طبريا، المعروفة ببحر الجليل. ووفقاً للأناجيل سار يسوع على ضفافها، وسأل تلاميذه أثناء العاصفة: «أين إيمانكم؟»','ترتبط تلال الجليل بالموعظة على الجبل، وينبع نهر الأردن من البحيرة متجهاً إلى الجنوب؛ أما موقع معمودية يسوع التقليدي فيقع أبعد بكثير مع مجرى النهر.','تقف طبريا على الضفة الغربية. تعاقبت الإمبراطوريات والأجيال، وما زالت الشمس تشرق فوق المياه. إلى هذه المدينة يتجه الطرد قبل أن يواصل طريقه إلى الصديق الذي خُصص له الغطاء.','حتى الأشياء البسيطة قد تحمل سيرة أطول من تاريخ الحضارة البشرية.']]
]},
fr:{home:'Le monde d’Alexandre Derevyashkin',genre:'Récit littéraire',title:'Le voyage d’une coque de téléphone',subtitle:'D’une mer ancienne aux rives du lac de Tibériade',author:'Alexandre Derevyashkin',intro:'Une simple coque noire de téléphone. Pourtant son histoire a commencé bien avant l’humanité et se poursuit aujourd’hui entre navires, avions et routes.',return:'← Accueil',note:'L’origine des matériaux et les étapes industrielles relèvent d’une reconstitution littéraire. Suivi confirmé : Newark le 11 octobre, Buena Park les 12 et 13 octobre ; transporteur Gaash Worldwide Ltd. Le 29 octobre 2026 est la date estimée par Amazon, non une livraison confirmée.',chapters:[
['Quand la Terre était jeune',['Il y a trois cents millions d’années, la Chine, l’Amérique et Israël n’existaient pas. Les mers anciennes regorgeaient d’organismes microscopiques. Après leur mort, ils s’accumulaient au fond, ensevelis sous les sédiments.','Pendant des millions d’années, la chaleur et la pression transformèrent une partie de cette matière organique en sources de pétrole et de gaz. Le pétrole provient surtout d’anciennes formes de vie microscopiques, et non des dinosaures.','La nature préparait déjà les matériaux d’objets encore inimaginables.']],
['La fontaine noire',['Bien des ères plus tard, les hommes apprirent à forer la roche pour faire remonter le pétrole. Les premiers gisements produisaient parfois d’impressionnants geysers noirs ; les puits modernes sont contrôlés.','Raffineries et usines chimiques transforment les hydrocarbures en matières premières des polymères. Les pièces métalliques et le verre suivent d’autres chemins, depuis les minerais et les minéraux.']],
['Naissance en Chine',['Dans une usine du Guangdong, des granulés de polymère chauffés sont injectés dans un moule métallique. Une pièce noire apparaît, marquée de lignes protectrices.','Des ouvriers assemblent la coque et son anneau de support. Ils tiennent un téléphone dans leurs mains et vérifient les ouvertures, les boutons et l’ajustement.','Enfin la coque est emballée, prête pour un long voyage.']],
['À travers le Pacifique',['Les grues du port chargent les conteneurs à bord d’un immense navire. Devant lui s’étend le Pacifique, avec ses tempêtes, ses levers de soleil et ses milliers de kilomètres.','Parmi d’innombrables objets, une petite coque noire voyage en silence, portant l’héritage chimique des océans anciens.']],
['Sur les routes de Californie',['Le 11 octobre 2026 à 15 h 48, Amazon enregistre l’arrivée du colis à Newark, en Californie. Il repart à 22 h 04.','Le 12 octobre à 11 h 08, il arrive à Buena Park. Le 13 octobre à 3 h 34, le suivi indique : « Le colis a quitté un centre Amazon. »','Voilà les étapes confirmées. Son transporteur international est Gaash Worldwide Ltd.']],
['Au-dessus des mers et des pays',['La route se poursuit vers Israël à travers le réseau mondial des aéroports et des centres logistiques. Des traversées qui duraient autrefois des mois s’effectuent désormais en quelques heures de vol.','Amazon annonce le 29 octobre comme date de livraison estimée : l’histoire n’est pas terminée.']],
['La terre de Galilée',['Au nord d’Israël s’étend le Kinneret, le lac de Tibériade. Selon les Évangiles, Jésus parcourut ses rives. Lors d’une tempête, il demanda à ses disciples : « Où est votre foi ? »','Les collines de Galilée sont associées au Sermon sur la montagne. Le Jourdain sort du lac et coule vers le sud ; le lieu traditionnel du baptême de Jésus se situe bien plus loin en aval.','Tibériade s’élève sur la rive occidentale. Les empires ont passé, mais le soleil se lève toujours au-dessus des eaux. C’est vers cette ville que le colis se dirige, avant de poursuivre sa route vers l’ami auquel la coque est destinée.','Même le plus simple objet peut avoir une histoire plus longue que celle de la civilisation humaine.']]
]}
};
function render(lang){const t=data[lang]||data.ru;document.documentElement.lang=lang;document.documentElement.dir=(lang==='he'||lang==='ar')?'rtl':'ltr';document.body.dir=document.documentElement.dir;for(const id of ['home','genre','title','subtitle','author','intro','note','return'])document.getElementById(id).textContent=t[id];document.title=t.title+' — '+t.author;document.getElementById('chapters').innerHTML=t.chapters.map((ch,i)=>'<article class="chapter"><div class="visual '+pictures[i][0]+'" role="img" aria-label="'+escapeHtml(ch[0])+'"><span class="art" aria-hidden="true">'+pictures[i][1]+'</span><span class="hint">✦</span></div><div class="copy"><small>'+(lang==='ru'?'Глава ':lang==='he'?'פרק ':lang==='ar'?'الفصل ':lang==='fr'?'Chapitre ':'Chapter ')+(i+1)+'</small><h2>'+escapeHtml(ch[0])+'</h2>'+ch[1].map(p=>'<p>'+escapeHtml(p)+'</p>').join('')+'</div></article>').join('');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));try{localStorage.setItem('caseLang',lang)}catch(e){}}function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));render('ru');const themes=document.querySelectorAll('[data-theme-choice]');function setCaseTheme(t){document.body.setAttribute('data-case-theme',t);themes.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===t)));try{localStorage.setItem('caseTheme',t)}catch(e){}}themes.forEach(b=>b.addEventListener('click',()=>setCaseTheme(b.dataset.themeChoice)));let savedTheme='beige';try{savedTheme=localStorage.getItem('caseTheme')||'beige'}catch(e){}setCaseTheme(['navy','green','beige','white'].includes(savedTheme)?savedTheme:'beige');
</script></body></html>
