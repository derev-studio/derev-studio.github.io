<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Прахим — Цветы и растения | Рынок Тверии</title><style>body{margin:0;font-family:system-ui;background:#f7faf5;color:#193d30}header{padding:55px 20px;background:linear-gradient(135deg,#185b42,#8db88c);color:white;text-align:center}h1{font-size:clamp(32px,7vw,56px);margin:12px}button{padding:11px;border:1px solid #ddd;border-radius:20px;background:white;margin:3px}main{max-width:950px;margin:auto;padding:22px}section{margin:30px 0}h2{font-size:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile{padding:30px 15px;border-radius:18px;background:white;box-shadow:0 4px 18px #183d3020;text-align:center}.emoji{font-size:55px}.story{background:#e7f3e9;padding:22px;border-radius:18px;line-height:1.7}footer{text-align:center;padding:25px}a{color:#175a45}</style></head><body><header><div id="langs"><button onclick="setLang('ru')">Русский</button><button onclick="setLang('he')">עברית</button><button onclick="setLang('en')">English</button><button onclick="setLang('ar')">العربية</button></div><div style="font-size:70px">🌺🌿🌸</div><h1 id="title">Прахим — Цветы и растения</h1><p id="subtitle">Передвижной рынок Тверии</p></header><main><section><h2 id="heading">Цветы, зелень и маленькие чудеса</h2><div class="grid" id="cards"></div></section><section class="story"><h2 id="storytitle">🍅 Маленький огород на подоконнике</h2><p id="story"></p><small>Александр Деревяшкин</small></section><section><p id="photos">📷 Фотогалерея рынка готовится к публикации.</p></section><p><a href="https://derev-studio.github.io/ohotnik/" id="back">← Охотник за скидками</a></p></main><footer>© Александр Деревяшкин · Тверия</footer><script>const d={ru:['Прахим — Цветы и растения','Передвижной рынок Тверии','Цветы, зелень и маленькие чудеса',['Хризантемы','Орхидеи','Цикламены','Мята и шалфей','Овощная рассада','Комнатные растения'],'Маленький огород на подоконнике','На рынке я купил крохотный кустик помидора с цветочками, мяту и шалфей. Уже через неделю появились помидорчики, а вскоре — целые гроздья! Без удобрений: только вода и солнечный свет. А ароматная зелень быстро разрослась прямо в квартире.','Фотогалерея рынка готовится к публикации.'],he:['פרחים וצמחים','השוק הנודד בטבריה','פרחים, עשבי תיבול ונפלאות קטנות',['חרציות','סחלבים','רקפות','נענע ומרווה','שתילי ירקות','צמחי בית'],'גינה קטנה על אדן החלון','בשוק קניתי שתיל עגבניות קטן עם פרחים, נענע ומרווה. כעבור שבוע הופיעו עגבניות קטנות, ובמהרה אשכולות שלמים! בלי להוסיף דשן — רק מים ושמש. עשבי התיבול צמחו במהירות בדירה.','גלריית התמונות מהשוק תתפרסם בקרוב.'],en:['Flowers and Plants','Tiberias weekly market','Flowers, herbs and little wonders',['Chrysanthemums','Orchids','Cyclamen','Mint and sage','Vegetable seedlings','Houseplants'],'A tiny garden on the windowsill','At the market I bought a tiny flowering tomato seedling, mint and sage. Within a week, small tomatoes appeared; soon there were whole clusters! I added no fertilizer, just water and sunshine. The herbs also flourished indoors.','Market photo gallery coming soon.'],ar:['الزهور والنباتات','السوق الأسبوعي في طبريا','زهور وأعشاب وعجائب صغيرة',['الأقحوان','الأوركيد','بخور مريم','النعناع والمريمية','شتلات الخضار','نباتات منزلية'],'حديقة صغيرة على حافة النافذة','اشتريت من السوق شتلة طماطم صغيرة مزهرة والنعناع والمريمية. بعد أسبوع ظهرت ثمار صغيرة، وسرعان ما أصبحت عناقيد كاملة! دون إضافة سماد، فقط الماء والشمس. ونمت الأعشاب بسرعة داخل المنزل.','معرض صور السوق قريباً.']};function setLang(l){let x=d[l];document.documentElement.lang=l;document.documentElement.dir=['he','ar'].includes(l)?'rtl':'ltr';['title','subtitle','heading'].forEach((id,i)=>document.getElementById(id).textContent=x[i]);document.getElementById('cards').innerHTML=x[3].map((s,i)=>'<div class="tile"><div class="emoji">'+['🌼','🌺','🌸','🌿','🍅','🪴'][i]+'</div><b>'+s+'</b></div>').join('');document.getElementById('storytitle').textContent='🍅 '+x[4];document.getElementById('story').textContent=x[5];document.getElementById('photos').textContent='📷 '+x[6]}setLang('ru')</script></body></html>
