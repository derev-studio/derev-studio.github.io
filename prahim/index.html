const GALLERY_INTRO={"he":"בשוק הנודד בטבריה פוגשים צבעים, ריחות ואנשים. בדוכן הפרחים מחכות חרציות, רקפות, סחלבים, צמחים לבית ועשבי תיבול. אלה תמונות אמיתיות שצילמתי בשוק.","ru":"Передвижной рынок Тверии — это краски, ароматы и люди. Здесь можно увидеть хризантемы, цикламены, орхидеи, комнатные растения и свежую зелень. На этих фотографиях — настоящий цветочный ряд, каким я увидел его сегодня.","en":"At the traveling Tiberias market, discover vivid colors, fragrances, and people. The flower stall has chrysanthemums, cyclamen, orchids, houseplants and fragrant herbs. These are my real photographs from the market.","ar":"في السوق المتنقل في طبريا تلتقي الألوان والروائح والناس. تجد زهور الأقحوان وبخور مريم والأوركيد والنباتات المنزلية والأعشاب العطرية. هذه صوري الحقيقية من السوق."};
const T={ru:{market:'Передвижной рынок · Тверия',title:'Цветы и растения',intro:'Живые краски рынка: цветущие растения, орхидеи, зелень и домашние цветы. Настоящие фотографии с прилавков.',heading:'Прогуляйтесь по цветочному ряду',all:'Все',categories:['Цветущий ряд','Орхидеи','Комнатные растения','Рассада и травы','Суккуленты','Рынок вокруг'],descs:['Яркие хризантемы и другие сезонные цветы','Орхидеи разных оттенков','Зелёные растения для дома','Ароматные травы и молодые растения','Небольшие декоративные растения','Прилавки, обувь и повседневная жизнь рынка'],note:'Фотографии сделаны на рынке. Наличие растений и цены уточняйте непосредственно у продавца. Онлайн-заказ и самостоятельное добавление товаров продавцом пока не подключены.',footer:'Передвижной рынок Тверии · Цветочная витрина · Фотографии с рынка'},he:{market:'השוק הנודד · טבריה',title:'פרחים וצמחים',intro:'הצבעים החיים של השוק: פרחים פורחים, סחלבים, צמחי תבלין וצמחי בית. תמונות אמיתיות מהדוכנים.',heading:'בואו לסיור בדוכן הפרחים',all:'הכול',categories:['פרחים עונתיים','סחלבים','צמחי בית','שתילים ועשבי תיבול','סוקולנטים','מראות השוק'],descs:['חרציות צבעוניות ופרחים עונתיים','סחלבים בגוונים שונים','צמחים ירוקים לבית','עשבי תיבול ושתילים צעירים','צמחי נוי קטנים','דוכנים, נעליים וחיי היומיום בשוק'],note:'התמונות צולמו בשוק. יש לברר זמינות ומחירים ישירות עם המוכר. הזמנות מקוונות והעלאת מוצרים על ידי המוכר עדיין אינן פעילות.',footer:'השוק הנודד בטבריה · דוכן פרחים · תמונות מהשוק'},en:{market:'Tiberias Weekly Market',title:'Flowers & Plants',intro:'The market in bloom: colorful flowers, orchids, herbs and houseplants. Real photographs from the stalls.',heading:'Explore the flower stall',all:'All',categories:['Seasonal flowers','Orchids','Houseplants','Seedlings & herbs','Succulents','Around the market'],descs:['Colorful chrysanthemums and seasonal flowers','Orchids in many shades','Green plants for your home','Fragrant herbs and young plants','Small decorative plants','Stalls, shoes and everyday market scenes'],note:'Photographs taken at the market. Please confirm availability and prices directly with the seller. Online orders and seller uploads are not yet available.',footer:'Tiberias Weekly Market · Flower showcase · Market photography'},ar:{market:'السوق الأسبوعي في طبريا',title:'الزهور والنباتات',intro:'ألوان السوق الزاهية: أزهار متفتحة وأوركيد وأعشاب عطرية ونباتات منزلية. صور حقيقية من البسطات.',heading:'تجوّل بين الزهور',all:'الكل',categories:['زهور موسمية','أوركيد','نباتات منزلية','شتلات وأعشاب','نباتات عصارية','مشاهد من السوق'],descs:['أقحوان ملون وزهور موسمية','أوركيد بألوان مختلفة','نباتات خضراء للمنزل','أعشاب عطرية وشتلات صغيرة','نباتات زينة صغيرة','بسطات وأحذية ومشاهد من حياة السوق'],note:'التُقطت الصور في السوق. يُرجى التأكد من التوفر والأسعار مباشرة من البائع. الطلبات عبر الإنترنت وإضافة المنتجات من البائع غير متاحين بعد.',footer:'السوق الأسبوعي في طبريا · معرض الزهور · صور من السوق'}};
const STORY={"ru": ["Маленький огород на подоконнике", "Александр Деревяшкин", "Чудо-помидоры", "На рынке я купил крохотный кустик помидора с цветочками. Уже через неделю появились плоды, а через полторы — целые гроздья! Только вода и солнечный свет, без добавления удобрений. И всё это в небольшом горшке у окна.", "Ароматные травы и волшебные цветы", "Мята и шалфей быстро разрослись у меня дома. Теперь свежая зелень и душистые приправы всегда под рукой. А на рынке столько чудесных цветов, что обычная квартира может превратиться в сад.", "Иногда для маленького чуда достаточно горшочка, воды и солнца."], "he": ["גינה קטנה על אדן החלון", "אלכסנדר דרביאשקין", "עגבניות קטנות, פלא גדול", "בשוק קניתי שתיל עגבניות זעיר עם פרחים. אחרי שבוע הופיעו פירות, וכעבור שבוע וחצי כבר היו אשכולות שלמים! רק מים ושמש, בלי להוסיף דשן — והכול בעציץ קטן ליד החלון.", "עשבי תיבול ופרחים קסומים", "הנענע והמרווה גדלו במהירות גם בבית. עכשיו יש לי עשבי תיבול טריים בהישג יד. ובשוק יש פרחים נפלאים שיכולים להפוך דירה רגילה לגינה פורחת.", "לפעמים כל מה שצריך לנס קטן הוא עציץ, מים ושמש."], "en": ["A little garden on the windowsill", "Alexander Derevyashkin", "Tiny tomatoes, big surprise", "At the market I bought a tiny flowering tomato seedling. Fruit appeared within a week, and after a week and a half there were whole clusters! Just water and sunlight, with no fertilizer added, in a small pot by the window.", "Fragrant herbs and magical flowers", "My mint and sage grew quickly indoors too. Now I have fresh herbs for tea and cooking close at hand. And the market’s wonderful flowers can turn an ordinary apartment into a blooming garden.", "Sometimes a little miracle needs only a pot, water and sunshine."], "ar": ["حديقة صغيرة على حافة النافذة", "ألكسندر ديريفياشكين", "طماطم صغيرة ومفاجأة كبيرة", "اشتريت من السوق شتلة طماطم صغيرة تحمل أزهارًا. بعد أسبوع ظهرت الثمار، وبعد أسبوع ونصف أصبحت عناقيد كاملة! بالماء وضوء الشمس فقط، دون إضافة سماد، وفي أصيص صغير قرب النافذة.", "أعشاب عطرية وزهور ساحرة", "نما النعناع والميرمية بسرعة داخل بيتي أيضًا. والآن لدي أعشاب طازجة للشاي والطعام. وفي السوق زهور رائعة يمكنها تحويل الشقة إلى حديقة مزهرة.", "أحيانًا تكفي أصيص وماء وشمس لصنع معجزة صغيرة."]};

];c.onclick=()=>{$('large').src=PHOTO_MAP[file];$('large').alt=t.categories[cat];$('viewer').showModal()};$('grid').append(c)})}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});$('close').onclick=()=>$('viewer').close();document.getElementById('commentForm').addEventListener('submit',e=>{e.preventDefault();let n=$('commentName').value.trim(),t=$('commentText').value.trim();if(!n||!t)return;let data=[];try{data=JSON.parse(localStorage.getItem('prahim-comments')||'[]')}catch(e){}data.unshift({name:n,text:t});localStorage.setItem('prahim-comments',JSON.stringify(data.slice(0,40)));e.target.reset();showComments()});function showComments(){let list=$('commentList');list.replaceChildren();let data=[];try{data=JSON.parse(localStorage.getItem('prahim-comments')||'[]')}catch(e){}data.forEach(c=>{let d=document.createElement('div'),b=document.createElement('b'),p=document.createElement('p');b.textContent=c.name;p.textContent=c.text;d.append(b,p);list.append(d)})}showComments();render();</script></body></html>
