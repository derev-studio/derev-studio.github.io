const GALLERY_INTRO={"he":"בשוק הנודד בטבריה פוגשים צבעים, ריחות ואנשים. בדוכן הפרחים מחכות חרציות, רקפות, סחלבים, צמחים לבית ועשבי תיבול. אלה תמונות אמיתיות שצילמתי בשוק.","ru":"Передвижной рынок Тверии — это краски, ароматы и люди. Здесь можно увидеть хризантемы, цикламены, орхидеи, комнатные растения и свежую зелень. На этих фотографиях — настоящий цветочный ряд, каким я увидел его сегодня.","en":"At the traveling Tiberias market, discover vivid colors, fragrances, and people. The flower stall has chrysanthemums, cyclamen, orchids, houseplants and fragrant herbs. These are my real photographs from the market.","ar":"في السوق المتنقل في طبريا تلتقي الألوان والروائح والناس. تجد زهور الأقحوان وبخور مريم والأوركيد والنباتات المنزلية والأعشاب العطرية. هذه صوري الحقيقية من السوق."};
const T={ru:{market:'Передвижной рынок · Тверия',title:'Цветы и растения',intro:'Живые краски рынка: цветущие растения, орхидеи, зелень и домашние цветы. Настоящие фотографии с прилавков.',heading:'Прогуляйтесь по цветочному ряду',all:'Все',categories:['Цветущий ряд','Орхидеи','Комнатные растения','Рассада и травы','Суккуленты'],descs:['Яркие хризантемы и другие сезонные цветы','Орхидеи разных оттенков','Зелёные растения для дома','Ароматные травы и молодые растения','Небольшие декоративные растения'],note:'Фотографии сделаны на рынке. Наличие растений и цены уточняйте непосредственно у продавца. Онлайн-заказ и самостоятельное добавление товаров продавцом пока не подключены.',footer:'Передвижной рынок Тверии · Цветочная витрина · Фотографии с рынка'},he:{market:'השוק הנודד · טבריה',title:'פרחים וצמחים',intro:'הצבעים החיים של השוק: פרחים פורחים, סחלבים, צמחי תבלין וצמחי בית. תמונות אמיתיות מהדוכנים.',heading:'בואו לסיור בדוכן הפרחים',all:'הכול',categories:['פרחים עונתיים','סחלבים','צמחי בית','שתילים ועשבי תיבול','סוקולנטים'],descs:['חרציות צבעוניות ופרחים עונתיים','סחלבים בגוונים שונים','צמחים ירוקים לבית','עשבי תיבול ושתילים צעירים','צמחי נוי קטנים'],note:'התמונות צולמו בשוק. יש לברר זמינות ומחירים ישירות עם המוכר. הזמנות מקוונות והעלאת מוצרים על ידי המוכר עדיין אינן פעילות.',footer:'השוק הנודד בטבריה · דוכן פרחים · תמונות מהשוק'},en:{market:'Tiberias Weekly Market',title:'Flowers & Plants',intro:'The market in bloom: colorful flowers, orchids, herbs and houseplants. Real photographs from the stalls.',heading:'Explore the flower stall',all:'All',categories:['Seasonal flowers','Orchids','Houseplants','Seedlings & herbs','Succulents'],descs:['Colorful chrysanthemums and seasonal flowers','Orchids in many shades','Green plants for your home','Fragrant herbs and young plants','Small decorative plants'],note:'Photographs taken at the market. Please confirm availability and prices directly with the seller. Online orders and seller uploads are not yet available.',footer:'Tiberias Weekly Market · Flower showcase · Market photography'},ar:{market:'السوق الأسبوعي في طبريا',title:'الزهور والنباتات',intro:'ألوان السوق الزاهية: أزهار متفتحة وأوركيد وأعشاب عطرية ونباتات منزلية. صور حقيقية من البسطات.',heading:'تجوّل بين الزهور',all:'الكل',categories:['زهور موسمية','أوركيد','نباتات منزلية','شتلات وأعشاب','نباتات عصارية'],descs:['أقحوان ملون وزهور موسمية','أوركيد بألوان مختلفة','نباتات خضراء للمنزل','أعشاب عطرية وشتلات صغيرة','نباتات زينة صغيرة'],note:'التُقطت الصور في السوق. يُرجى التأكد من التوفر والأسعار مباشرة من البائع. الطلبات عبر الإنترنت وإضافة المنتجات من البائع غير متاحين بعد.',footer:'السوق الأسبوعي في طبريا · معرض الزهور · صور من السوق'}};
const STORY={"ru": ["Маленький огород на подоконнике", "Александр Деревяшкин", "Чудо-помидоры", "На рынке я купил крохотный кустик помидора с цветочками. Уже через неделю появились плоды, а через полторы — целые гроздья! Только вода и солнечный свет, без добавления удобрений. И всё это в небольшом горшке у окна.", "Ароматные травы и волшебные цветы", "Мята и шалфей быстро разрослись у меня дома. Теперь свежая зелень и душистые приправы всегда под рукой. А на рынке столько чудесных цветов, что обычная квартира может превратиться в сад.", "Иногда для маленького чуда достаточно горшочка, воды и солнца."], "he": ["גינה קטנה על אדן החלון", "אלכסנדר דרביאשקין", "עגבניות קטנות, פלא גדול", "בשוק קניתי שתיל עגבניות זעיר עם פרחים. אחרי שבוע הופיעו פירות, וכעבור שבוע וחצי כבר היו אשכולות שלמים! רק מים ושמש, בלי להוסיף דשן — והכול בעציץ קטן ליד החלון.", "עשבי תיבול ופרחים קסומים", "הנענע והמרווה גדלו במהירות גם בבית. עכשיו יש לי עשבי תיבול טריים בהישג יד. ובשוק יש פרחים נפלאים שיכולים להפוך דירה רגילה לגינה פורחת.", "לפעמים כל מה שצריך לנס קטן הוא עציץ, מים ושמש."], "en": ["A little garden on the windowsill", "Alexander Derevyashkin", "Tiny tomatoes, big surprise", "At the market I bought a tiny flowering tomato seedling. Fruit appeared within a week, and after a week and a half there were whole clusters! Just water and sunlight, with no fertilizer added, in a small pot by the window.", "Fragrant herbs and magical flowers", "My mint and sage grew quickly indoors too. Now I have fresh herbs for tea and cooking close at hand. And the market’s wonderful flowers can turn an ordinary apartment into a blooming garden.", "Sometimes a little miracle needs only a pot, water and sunshine."], "ar": ["حديقة صغيرة على حافة النافذة", "ألكسندر ديريفياشكين", "طماطم صغيرة ومفاجأة كبيرة", "اشتريت من السوق شتلة طماطم صغيرة تحمل أزهارًا. بعد أسبوع ظهرت الثمار، وبعد أسبوع ونصف أصبحت عناقيد كاملة! بالماء وضوء الشمس فقط، دون إضافة سماد، وفي أصيص صغير قرب النافذة.", "أعشاب عطرية وزهور ساحرة", "نما النعناع والميرمية بسرعة داخل بيتي أيضًا. والآن لدي أعشاب طازجة للشاي والطعام. وفي السوق زهور رائعة يمكنها تحويل الشقة إلى حديقة مزهرة.", "أحيانًا تكفي أصيص وماء وشمس لصنع معجزة صغيرة."]};

const items=[["IMG_0238.jpeg",1],["IMG_0245.jpeg",0],["IMG_0242.jpeg",3],["IMG_0240.jpeg",2],["IMG_0237.jpeg",4],["IMG_0241.jpeg",0],["IMG_0247.jpeg",0],["IMG_0248.jpeg",0]];let lang='he',filter=-1;document.getElementById('hero').style.background='linear-gradient(0deg,#142a25de,#142a2512),url("'+PHOTO_MAP['IMG_0235.jpeg']+'") center 48%/cover';const $=id=>document.getElementById(id);function render(){let t=T[lang];document.documentElement.lang=lang;document.body.dir=['he','ar'].includes(lang)?'rtl':'ltr';['market','title','intro','heading','note','footer'].forEach(k=>$(k).textContent=t[k]);$('galleryIntro').textContent=GALLERY_INTRO[lang];let cl=COMMENT_LABELS[lang];$('commentHeading').textContent=cl[0];$('commentSub').textContent=cl[1];$('commentName').placeholder=cl[2];$('commentText').placeholder=cl[3];$('commentButton').textContent=cl[4];$('commentCaveat').textContent=cl[5];['storytitle','storyby','story1title','story1','story2title','story2','storyend'].forEach((k,i)=>$(k).textContent=STORY[lang][i]);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('filters').innerHTML='';[t.all,...t.categories].forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.className=filter===i-1?'active':'';b.onclick=()=>{filter=i-1;render()};$('filters').append(b)});$('grid').innerHTML='';items.filter(x=>filter===-1||x[1]===filter).forEach(([file,cat])=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<img loading="lazy" src="${PHOTO_MAP[file]}" alt=""><div class="copy"><h3></h3><p></p></div>`;const label=PHOTO_LABELS[lang][file];c.querySelector('h3').textContent=label[0];c.querySelector('p').textContent=label[1];c.querySelector('img').alt=label[0];c.onclick=()=>{$('large').src=PHOTO_MAP[file];$('large').alt=t.categories[cat];$('viewer').showModal()};$('grid').append(c)})}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});$('close').onclick=()=>$('viewer').close();document.getElementById('commentForm').addEventListener('submit',e=>{e.preventDefault();let n=$('commentName').value.trim(),t=$('commentText').value.trim();if(!n||!t)return;let data=[];try{data=JSON.parse(localStorage.getItem('prahim-comments')||'[]')}catch(e){}data.unshift({name:n,text:t});localStorage.setItem('prahim-comments',JSON.stringify(data.slice(0,40)));e.target.reset();showComments()});function showComments(){let list=$('commentList');list.replaceChildren();let data=[];try{data=JSON.parse(localStorage.getItem('prahim-comments')||'[]')}catch(e){}data.forEach(c=>{let d=document.createElement('div'),b=document.createElement('b'),p=document.createElement('p');b.textContent=c.name;p.textContent=c.text;d.append(b,p);list.append(d)})}showComments();render();</script></body></html>
