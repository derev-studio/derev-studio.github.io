<style>
:root{--bg:#0f1115;--card:#171a21;--ink:#eae7e1;--dim:#a49f97;--gold:#d8b26a;--line:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:26px 16px 60px}
a.home{color:var(--dim);text-decoration:none;font-size:14px}
h1{font-size:26px;margin:16px 0 6px}
.sub{color:var(--dim);font-size:15px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;display:flex;gap:16px;align-items:center}
.card img{width:64px;border-radius:8px;flex:0 0 auto}
.card .info{flex:1;min-width:0}
.card .t{font-weight:700;font-size:17px;margin-bottom:4px}
.card .pr{color:var(--gold);font-weight:700}
.btn{display:inline-block;background:var(--gold);color:#141414;border:0;border-radius:11px;padding:11px 20px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.muted{background:transparent;border:1px solid var(--gold);color:var(--gold);font-weight:600;font-size:13px;padding:9px 16px}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:20px;padding-top:18px;font-size:19px;font-weight:700}
.note{color:var(--dim);font-size:14px;margin-top:14px}
.badge{display:inline-block;background:#3a2f16;color:var(--gold);border:1px solid #5c4a22;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}
.ok{background:#16261a;border:1px solid #2c5c39;color:#a8e6b8;border-radius:14px;padding:18px;margin-bottom:20px}
.empty{color:var(--dim);text-align:center;padding:40px 0}
</style>
</head>

const LINKS=(window.PAYLINKS||{});
const CART_KEY='derev_cart';
function money(v){return (Math.round(v*100)/100).toFixed(0)+' \u20bd';}
function params(){const p=new URLSearchParams(location.search);return {id:p.get('id'),ok:p.get('ok')};}
function byId(id){return GOODS.find(g=>String(g.id)===String(id));}
function items(){
  const q=params();
  if(q.id){const g=byId(q.id);return g?[g]:[];}
  let cart=[];try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]');}catch(e){}
  return cart.map(c=>byId(c.id)).filter(Boolean);
}
function payUrl(g){return LINKS[String(g.id)]||'';}
function render(){
  const q=params(), list=document.getElementById('list');
  if(q.ok){const el=document.getElementById('ok');el.style.display='block';
    el.innerHTML='<b>Спасибо за покупку!</b><br>Оплата прошла. Книгу пришлю на вашу почту в течение дня. '
      +'Если письма нет — напишите на <a style="color:#a8e6b8" href="mailto:derev.derev@mail.ru">derev.derev@mail.ru</a> '
      +'и укажите название книги.';}
  const it=items();
  if(!it.length){list.innerHTML='<div class="empty">Корзина пуста.<br><br><a class="btn sec" href="/derevyashkin-writer/shop/index.html">Вернуться в магазин</a></div>';
    document.getElementById('foot').innerHTML='';document.getElementById('hint').innerHTML='';return;}
  let sum=0, html='';
  it.forEach(g=>{
    const price=g.price||0; sum+=price;
    const u=payUrl(g);
    const act = u
      ? '<a class="btn" href="'+u+'" target=_blank rel=noopener>Оплатить '+money(price)+'</a>'
      : '<a class="btn muted" href="'+g.url+'" target=_blank rel=noopener>Купить на ЛитРес '+money(price)+'</a>';
    const badge = u ? '' : '<span class="badge">картой на сайте — скоро</span>';
    html+='<div class="card">'+(g.cover?'<img src="'+g.cover+'" alt="">':'')+
      '<div class="info"><div class="t">'+g.t+badge+'</div><div class="pr">'+money(price)+'</div></div>'+act+'</div>';
  });
  list.innerHTML=html;
  document.getElementById('foot').innerHTML='<div class="total"><span>Итого</span><span>'+money(sum)+'</span></div>'+
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn sec" onclick="clearCart()">Очистить корзину</button>'+
    '<a class="btn sec" href="/derevyashkin-writer/shop/index.html">Добавить ещё книгу</a></div>';
  document.getElementById('hint').innerHTML =
    Object.keys(LINKS).length
      ? 'Нажимайте «Оплатить» по одной книге. После оплаты файл выдаётся автоматически.'
      : 'Пока оплата картой на сайте не подключена — книги продаются на ЛитРес, кнопка слева. Прямая оплата заработает, как только подключим кассу: страница уже готова, останется вставить ссылку.';
}
function clearCart(){localStorage.removeItem(CART_KEY);render();}
render();
</script>
