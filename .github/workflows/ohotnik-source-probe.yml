name: Probe permitted product sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ohotnik-source-probe.yml'
      - 'ohotnik/tools/source_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check retailer XML catalog availability
        run: python -u ohotnik/tools/source_probe.py
