name: Update Ohotnik product catalog
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ohotnik-catalog.yml'
  schedule:
    - cron: '17 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: ohotnik-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh public products
        id: refresh
        run: python ohotnik/tools/build_catalog.py
      - name: Publish refreshed catalog
        run: |
          if git diff --quiet -- ohotnik/catalog.json; then
            echo "No updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ohotnik/catalog.json
          git commit -m "Refresh Ohotnik catalog"
          git push
