name: Build unified product index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ohotnik-universal-index.yml'
      - 'ohotnik/tools/build_public_index.py'
      - 'ohotnik/tools/check_public_index.py'
  schedule:
    - cron: '18 4,16 * * *'
permissions:
  contents: write
concurrency:
  group: ohotnik-public-index
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build index from permitted public product sitemaps
        run: python -u ohotnik/tools/build_public_index.py
      - name: Verify merchant ownership, prices and direct links
        run: python -u ohotnik/tools/check_public_index.py
      - name: Check storefront JavaScript syntax
        run: |
          node <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('ohotnik/index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) throw new Error('No inline application script');
          new Function(m[1]);
          console.log('UI JavaScript syntax OK');
          JS
      - name: Publish searchable product index
        run: |
          if git diff --quiet -- ohotnik/catalog-auto.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ohotnik/catalog-auto.json
          git commit -m "Refresh multi-store product index"
          # Reconcile site changes made while the catalog was collected.
          # Never force-push or overwrite the user's other website updates.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo "Catalog published"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not publish catalog after 3 non-force retries" >&2
          exit 1
